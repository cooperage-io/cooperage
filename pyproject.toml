[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "ruff>=0.4.0",
]

[project]
name = "cooperage"
version = "0.1.0"
description = "Ephemeral container orchestration for MCP servers"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "docker>=7.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "rich>=13.0.0",
    "anyio>=4.0.0",
    "kubernetes>=28.0.0",
]

[project.scripts]
cooperage = "cooperage.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["cooperage"]
