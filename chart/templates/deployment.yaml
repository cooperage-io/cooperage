apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooperage-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cooperage
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cooperage
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cooperage
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: cooperage-gateway
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [cooperage, start, --sse, --host, "0.0.0.0", --port, "8080"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cooperage-gateway
          {{- if .Values.auth.jwtSecret }}
          env:
            - name: COOPERAGE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cooperage-gateway-secrets
                  key: jwt-secret
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data/cooperage
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cooperage-gateway-data
      {{- end }}
