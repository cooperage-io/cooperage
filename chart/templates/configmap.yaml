apiVersion: v1
kind: ConfigMap
metadata:
  name: cooperage-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cooperage
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  COOPERAGE_ORCHESTRATOR: kubernetes
  COOPERAGE_K8S_NAMESPACE: {{ .Values.workloadNamespace | quote }}
  COOPERAGE_K8S_HOST_PATH_PREFIX: {{ .Values.kubernetes.hostPathPrefix | quote }}
  COOPERAGE_K8S_NODE_PORT_RANGE_START: {{ .Values.kubernetes.nodePortRangeStart | quote }}
  COOPERAGE_K8S_NODE_PORT_RANGE_END: {{ .Values.kubernetes.nodePortRangeEnd | quote }}
  {{- if .Values.persistence.enabled }}
  COOPERAGE_SESSIONS_PATH: "/data/cooperage/sessions.json"
  COOPERAGE_REGISTRY_PATH: "/data/cooperage/registry.json"
  {{- end }}
  COOPERAGE_GATEWAY_HOST: "0.0.0.0"
  COOPERAGE_GATEWAY_PORT: "8080"
  COOPERAGE_SESSION_TTL_SECONDS: {{ .Values.session.ttlSeconds | quote }}
  COOPERAGE_SESSION_CLEANUP_INTERVAL: {{ .Values.session.cleanupInterval | quote }}
  COOPERAGE_CONTAINER_IDLE_TIMEOUT: {{ .Values.session.idleTimeout | quote }}
  COOPERAGE_SESSION_EXTEND_ON_ACTIVITY: {{ .Values.session.extendOnActivity | quote }}
  COOPERAGE_DEFAULT_CPU_LIMIT: {{ .Values.containerDefaults.cpuLimit | quote }}
  COOPERAGE_DEFAULT_MEMORY_LIMIT: {{ .Values.containerDefaults.memoryLimit | quote }}
  COOPERAGE_NETWORK_ISOLATION: {{ .Values.networkIsolation | quote }}
  {{- if .Values.imageRegistryPrefix }}
  COOPERAGE_IMAGE_REGISTRY_PREFIX: {{ .Values.imageRegistryPrefix | quote }}
  {{- end }}
  {{- if .Values.ui.enabled }}
  COOPERAGE_UI_URL: "http://cooperage-ui.{{ .Release.Namespace }}.svc:{{ .Values.ui.port }}"
  {{- end }}
